name: CI

on:
  push:
    branches: [init, main, "feat/**", "fix/**"]
  pull_request:
    branches: [init, main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race -count=1 -timeout=180s ./...
      - name: build
        run: |
          go build -trimpath -o /tmp/avangard-server ./cmd/avangard-server
          go build -trimpath -o /tmp/avangard-client ./cmd/avangard-client

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: install golangci-lint from source (build with current Go)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: lint
        run: golangci-lint run --timeout=5m ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: server
          push: false
          tags: avangard-server:ci
      - name: build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: client
          push: false
          tags: avangard-client:ci
